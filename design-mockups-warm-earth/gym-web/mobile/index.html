<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop - Gym Web Mobile (Warm Earth Theme)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #FDF6E3;
            --cream-dark: #F5ECD7;
            --terracotta: #C45D35;
            --sage: #7A9E7E;
            --brown: #3D2B1F;
            --taupe: #8B7355;
            --sand: #D4C4A8;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px rgba(61, 43, 31, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%);
            color: var(--brown);
            min-height: 100vh;
            padding: 40px 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--terracotta);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--sage), var(--sage-light));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 30px rgba(122, 158, 126, 0.3);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--taupe);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--taupe);
            margin-bottom: 24px;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .screen-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
            box-shadow: var(--glass-shadow);
        }

        .screen-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(61, 43, 31, 0.15);
        }

        .screen-preview {
            height: 200px;
            background: linear-gradient(135deg, var(--cream), var(--cream-dark));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-placeholder {
            font-size: 48px;
        }

        .screen-info {
            padding: 20px;
        }

        .screen-number {
            font-size: 10px;
            color: var(--taupe);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .screen-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--brown);
            margin-bottom: 6px;
        }

        .screen-desc {
            font-size: 13px;
            color: var(--taupe);
            line-height: 1.4;
        }

        .footer {
            text-align: center;
            padding-top: 48px;
            margin-top: 48px;
            border-top: 1px solid var(--sand);
        }

        .footer p {
            font-size: 13px;
            color: var(--taupe);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="../../index.html" class="back-link">← Back to All Themes</a>
            <div class="logo">📱</div>
            <h1>Gym Web Mobile</h1>
            <p class="subtitle">Warm Earth + Glassmorphism Theme</p>
        </header>

        <h2 class="section-title">All Screens (1)</h2>
        <div class="screens-grid">
            <a href="01-dashboard.html" class="screen-card">
                <div class="screen-preview">
                    <span class="screen-placeholder">📊</span>
                </div>
                <div class="screen-info">
                    <div class="screen-number">Screen 01</div>
                    <div class="screen-name">Dashboard</div>
                    <div class="screen-desc">Mobile gym dashboard for owners on the go</div>
                </div>
            </a>
        </div>

        <footer class="footer">
            <p>StudioLoop • Warm Earth Theme • Gym Web Mobile Portal</p>
        </footer>
    </div>
</body>
</html>
