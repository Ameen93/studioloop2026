<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop - Login (Warm Earth)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #FDF6E3;
            --cream-dark: #F5ECD7;
            --terracotta: #C45D35;
            --terracotta-light: #E07B52;
            --sage: #7A9E7E;
            --sage-light: #9BB89E;
            --brown: #3D2B1F;
            --brown-light: #5C4033;
            --taupe: #8B7355;
            --sand: #D4C4A8;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px rgba(61, 43, 31, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%);
            color: var(--brown);
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 60px 24px 24px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 30px rgba(196, 93, 53, 0.3);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: var(--brown);
        }

        .logo-tagline {
            font-size: 14px;
            color: var(--taupe);
            margin-top: 8px;
        }

        /* Form */
        .form-section {
            margin-bottom: 24px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--brown);
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--taupe);
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--taupe);
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-field {
            width: 100%;
            padding: 18px 18px 18px 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 15px;
            color: var(--brown);
            transition: all 0.3s;
            box-shadow: var(--glass-shadow);
        }

        .input-field::placeholder {
            color: var(--taupe);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--terracotta);
            box-shadow: 0 0 0 4px rgba(196, 93, 53, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            cursor: pointer;
            color: var(--taupe);
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--terracotta);
            text-decoration: none;
            font-weight: 500;
            margin-top: 12px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: white;
            border: none;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(196, 93, 53, 0.4);
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(196, 93, 53, 0.5);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--sand);
        }

        .divider-text {
            padding: 0 16px;
            font-size: 12px;
            color: var(--taupe);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .social-btn {
            flex: 1;
            padding: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--brown);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--glass-shadow);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .social-btn .icon {
            font-size: 20px;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            text-align: center;
            padding: 24px;
        }

        .signup-link {
            font-size: 14px;
            color: var(--taupe);
        }

        .signup-link a {
            color: var(--terracotta);
            font-weight: 600;
            text-decoration: none;
        }

        /* Screen Label */
        .screen-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--terracotta);
            color: white;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="screen-label">Login</div>

    <header class="header">
        <button class="back-btn">←</button>
    </header>

    <main class="main">
        <div class="logo-section">
            <div class="logo">🏃</div>
            <h1 class="logo-text">StudioLoop</h1>
            <p class="logo-tagline">Find your perfect workout</p>
        </div>

        <div class="form-section">
            <h2 class="form-title">Welcome back</h2>
            <p class="form-subtitle">Sign in to continue your fitness journey</p>

            <div class="input-group">
                <label class="input-label">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" class="input-field" placeholder="your@email.com">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" class="input-field" placeholder="Enter your password">
                    <span class="password-toggle">👁️</span>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button class="btn-primary">Sign In</button>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or continue with</span>
            <div class="divider-line"></div>
        </div>

        <div class="social-buttons">
            <button class="social-btn">
                <span class="icon">🍎</span>
                <span>Apple</span>
            </button>
            <button class="social-btn">
                <span class="icon">🔵</span>
                <span>Google</span>
            </button>
        </div>
    </main>

    <footer class="footer">
        <p class="signup-link">
            Don't have an account? <a href="08-register.html">Sign up</a>
        </p>
    </footer>
</body>
</html>
