<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop - Consumer Web Screens (Mobile)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a855;
            --black: #0a0a0a;
            --charcoal: #1a1a1a;
            --gray: #2a2a2a;
            --gray-light: #3a3a3a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .logo { font-size: 48px; margin-bottom: 16px; }

        h1 {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        h1 strong { font-weight: 600; color: var(--gold); }

        .subtitle { color: var(--text-muted); font-size: 16px; }

        .badge {
            display: inline-block;
            background: var(--gold);
            color: var(--black);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 16px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin: 32px 0;
            padding: 24px;
            background: var(--charcoal);
            border-radius: 20px;
        }

        .stat { text-align: center; }

        .stat-value {
            font-size: 36px;
            font-weight: 300;
            color: var(--gold);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section { margin-bottom: 48px; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-light);
        }

        .screen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .screen-card {
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text);
        }

        .screen-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
        }

        .screen-preview {
            height: 200px;
            background: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }

        .screen-info { padding: 20px; }

        .screen-number {
            font-size: 11px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .screen-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .screen-desc {
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="../../index.html" class="back-link">← Back to All Apps</a>
            <div class="logo">📱</div>
            <h1>Consumer Web <strong>Mobile</strong></h1>
            <p class="subtitle">Responsive Mobile Views</p>
            <span class="badge">Premium Luxe Theme</span>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-value">1</div>
                <div class="stat-label">Screens</div>
            </div>
            <div class="stat">
                <div class="stat-value">23</div>
                <div class="stat-label">Total Planned</div>
            </div>
        </div>

        <section class="section">
            <h2 class="section-title">Core Screens</h2>
            <div class="screen-grid">
                <a href="01-home.html" class="screen-card">
                    <div class="screen-preview">🏠</div>
                    <div class="screen-info">
                        <div class="screen-number">Screen 01</div>
                        <div class="screen-name">Home</div>
                        <div class="screen-desc">Mobile web home view</div>
                    </div>
                </a>
            </div>
        </section>
    </div>
</body>
</html>
