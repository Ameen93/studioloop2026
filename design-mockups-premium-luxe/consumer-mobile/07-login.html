<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a855;
            --gold-light: #f5e6c8;
            --black: #0a0a0a;
            --charcoal: #1a1a1a;
            --gray: #2a2a2a;
            --gray-light: #3a3a3a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--text);
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: flex-start;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--gold);
            font-weight: 600;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Form Section */
        .form-section {
            flex: 1;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .forgot-link {
            display: block;
            text-align: right;
            color: var(--gold);
            font-size: 13px;
            text-decoration: none;
            margin-top: 12px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }

        .btn-primary:hover {
            background: #e6bc6a;
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--gray-light);
        }

        .divider-text {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 16px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-social:hover {
            border-color: var(--gold);
        }

        .btn-social .icon {
            font-size: 20px;
        }

        /* Footer */
        .footer {
            padding: 24px;
            text-align: center;
        }

        .signup-prompt {
            font-size: 14px;
            color: var(--text-muted);
        }

        .signup-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        /* Screen Label */
        .screen-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--gold);
            color: var(--black);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="screen-label">Login</div>

    <header class="header">
        <button class="back-btn" onclick="history.back()">←</button>
    </header>

    <main class="main">
        <div class="logo-section">
            <div class="logo">🏋️</div>
            <h1 class="brand-name">Studio<span>Loop</span></h1>
            <p class="tagline">Your fitness journey starts here</p>
        </div>

        <div class="form-section">
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">Sign in to continue your fitness journey</p>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="input-field" placeholder="Enter your password">
                    <button class="password-toggle">👁</button>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button class="btn-primary">Sign In</button>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">Or continue with</span>
                <span class="divider-line"></span>
            </div>

            <div class="social-buttons">
                <button class="btn-social">
                    <span class="icon">G</span>
                    <span>Google</span>
                </button>
                <button class="btn-social">
                    <span class="icon">🍎</span>
                    <span>Apple</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="signup-prompt">
            Don't have an account? <a href="08-register.html" class="signup-link">Sign Up</a>
        </p>
    </footer>
</body>
</html>
