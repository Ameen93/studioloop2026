<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a855;
            --gold-light: #f5e6c8;
            --black: #0a0a0a;
            --charcoal: #1a1a1a;
            --gray: #2a2a2a;
            --gray-light: #3a3a3a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--text);
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: flex-start;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Form Header */
        .form-header {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        .step {
            flex: 1;
            height: 4px;
            background: var(--gray-light);
            border-radius: 2px;
        }

        .step.active {
            background: var(--gold);
        }

        .step.completed {
            background: var(--gold);
        }

        /* Form Section */
        .form-section {
            flex: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-row .input-group {
            flex: 1;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 12px;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .strength-segment {
            flex: 1;
            height: 4px;
            background: var(--gray-light);
            border-radius: 2px;
        }

        .strength-segment.active {
            background: var(--gold);
        }

        .strength-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Terms */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 24px 0;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            background: var(--charcoal);
            border: 2px solid var(--gray-light);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        .checkbox.checked {
            background: var(--gold);
            border-color: var(--gold);
        }

        .checkbox.checked::after {
            content: '✓';
            color: var(--black);
            font-size: 14px;
            font-weight: bold;
        }

        .terms-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .terms-text a {
            color: var(--gold);
            text-decoration: none;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #e6bc6a;
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--gray-light);
        }

        .divider-text {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 16px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-social:hover {
            border-color: var(--gold);
        }

        .btn-social .icon {
            font-size: 20px;
        }

        /* Footer */
        .footer {
            padding: 24px;
            text-align: center;
        }

        .login-prompt {
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        /* Screen Label */
        .screen-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--gold);
            color: var(--black);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="screen-label">Register</div>

    <header class="header">
        <button class="back-btn" onclick="history.back()">←</button>
    </header>

    <main class="main">
        <div class="form-header">
            <h1 class="form-title">Create Account</h1>
            <p class="form-subtitle">Join the StudioLoop fitness community</p>
        </div>

        <div class="progress-steps">
            <div class="step active"></div>
            <div class="step"></div>
            <div class="step"></div>
        </div>

        <div class="form-section">
            <div class="input-row">
                <div class="input-group">
                    <label class="input-label">First Name</label>
                    <input type="text" class="input-field" placeholder="First">
                </div>
                <div class="input-group">
                    <label class="input-label">Last Name</label>
                    <input type="text" class="input-field" placeholder="Last">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <label class="input-label">Phone Number</label>
                <input type="tel" class="input-field" placeholder="+27 XX XXX XXXX">
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="input-field" placeholder="Create a password">
                    <button class="password-toggle">👁</button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-segment active"></div>
                        <div class="strength-segment active"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                    </div>
                    <span class="strength-text">Medium strength - add numbers or symbols</span>
                </div>
            </div>

            <div class="terms-group">
                <div class="checkbox checked"></div>
                <p class="terms-text">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. I understand that I can unsubscribe at any time.
                </p>
            </div>

            <button class="btn-primary">Create Account</button>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">Or sign up with</span>
                <span class="divider-line"></span>
            </div>

            <div class="social-buttons">
                <button class="btn-social">
                    <span class="icon">G</span>
                    <span>Google</span>
                </button>
                <button class="btn-social">
                    <span class="icon">🍎</span>
                    <span>Apple</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="login-prompt">
            Already have an account? <a href="07-login.html" class="login-link">Sign In</a>
        </p>
    </footer>
</body>
</html>
