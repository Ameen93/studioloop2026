<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop Gym - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a855;
            --gold-light: #f5e6c8;
            --black: #0a0a0a;
            --charcoal: #1a1a1a;
            --gray: #2a2a2a;
            --gray-light: #3a3a3a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* Left Panel - Branding */
        .brand-panel {
            flex: 1;
            background: linear-gradient(135deg, var(--charcoal) 0%, var(--black) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 168, 85, 0.1) 0%, transparent 70%);
        }

        .brand-panel::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 168, 85, 0.05) 0%, transparent 70%);
        }

        .brand-content {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand-logo {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .brand-name {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .brand-name span {
            color: var(--gold);
            font-weight: 600;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 48px;
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 48px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--gray-light);
        }

        .feature-icon {
            font-size: 24px;
        }

        .feature-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Right Panel - Login Form */
        .login-panel {
            width: 500px;
            background: var(--charcoal);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            border-left: 1px solid var(--gray-light);
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--gray);
            border: 1px solid var(--gray-light);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--gold);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            background: var(--gray);
            border: 2px solid var(--gray-light);
            border-radius: 4px;
        }

        .remember-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        .forgot-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #e6bc6a;
            transform: translateY(-2px);
        }

        .login-footer {
            margin-top: 32px;
            text-align: center;
        }

        .help-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .help-link {
            color: var(--gold);
            text-decoration: none;
        }

        /* Screen Label */
        .screen-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--gold);
            color: var(--black);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="screen-label">Gym Login - Desktop</div>

    <div class="brand-panel">
        <div class="brand-content">
            <div class="brand-logo">🏋️</div>
            <h1 class="brand-name">Studio<span>Loop</span></h1>
            <p class="brand-subtitle">Gym Management</p>

            <div class="brand-features">
                <div class="feature">
                    <span class="feature-icon">📊</span>
                    <span class="feature-text">Real-time class and booking management</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">👥</span>
                    <span class="feature-text">Complete member management system</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📱</span>
                    <span class="feature-text">QR check-in and attendance tracking</span>
                </div>
            </div>
        </div>
    </div>

    <div class="login-panel">
        <div class="login-header">
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-subtitle">Sign in to manage your gym</p>
        </div>

        <form>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="you@yourgym.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-input" placeholder="Enter your password">
                    <button type="button" class="password-toggle">👁</button>
                </div>
            </div>

            <div class="form-row">
                <label class="remember-label">
                    <div class="checkbox"></div>
                    <span class="remember-text">Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="login-footer">
            <p class="help-text">
                Need help? <a href="#" class="help-link">Contact Support</a>
            </p>
        </div>
    </div>
</body>
</html>
