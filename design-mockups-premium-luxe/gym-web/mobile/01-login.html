<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioLoop Gym - Login (Mobile)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a855;
            --gold-light: #f5e6c8;
            --black: #0a0a0a;
            --charcoal: #1a1a1a;
            --gray: #2a2a2a;
            --gray-light: #3a3a3a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--text);
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--gold);
            font-weight: 600;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 8px;
        }

        /* Form Section */
        .form-section {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--charcoal);
            border: 1px solid var(--gray-light);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--gold);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .forgot-link {
            display: block;
            text-align: right;
            color: var(--gold);
            font-size: 13px;
            text-decoration: none;
            margin-top: 12px;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }

        .btn-primary:hover {
            background: #e6bc6a;
        }

        /* Footer */
        .footer {
            padding: 24px;
            text-align: center;
        }

        .help-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .help-link {
            color: var(--gold);
            text-decoration: none;
        }

        /* Screen Label */
        .screen-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--gold);
            color: var(--black);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="screen-label">Gym Login - Mobile</div>

    <main class="main">
        <div class="logo-section">
            <div class="logo">🏋️</div>
            <h1 class="brand-name">Studio<span>Loop</span></h1>
            <p class="brand-subtitle">Gym Management</p>
        </div>

        <div class="form-section">
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">Sign in to manage your gym</p>

            <form>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="you@yourgym.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" placeholder="Enter your password">
                        <button type="button" class="password-toggle">👁</button>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p class="help-text">
            Need help? <a href="#" class="help-link">Contact Support</a>
        </p>
    </footer>
</body>
</html>
