# StudioLoop E2E Tests
# Runs Playwright E2E tests manually (not on every PR)
#
# This workflow requires:
# - Backend running with database
# - Seed data populated
#
# Run manually from GitHub Actions UI or locally:
#   cd frontend && pnpm test:e2e

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This job needs a running backend and database
    # For now, this is a placeholder showing the structure
    # Full E2E CI would need docker-compose or a staging environment

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_NAME: studioloop-test
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changethis

    steps:
      - uses: actions/checkout@v4

      # Setup backend
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --dev

      - name: Run database migrations
        working-directory: ./backend
        run: uv run alembic upgrade head

      - name: Seed database
        working-directory: ./backend
        run: uv run python scripts/seed.py --reset

      - name: Start backend server
        working-directory: ./backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10  # Wait for server to start

      # Setup frontend
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps ${{ github.event.inputs.browser || 'chromium' }}

      # Run E2E tests
      - name: Run E2E tests
        working-directory: ./frontend
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7
